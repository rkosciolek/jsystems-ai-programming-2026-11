header{display:flex;flex-direction:column;gap:12px;padding-block:8px 20px}

h2{font-family:var(--serif);font-weight:700;font-size:clamp(24px,4vw,30px);line-height:1.15;margin:0 0 6px;text-wrap:balance}
.lede{font-size:18px;color:var(--ink);max-width:62ch;margin:0}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:14px;background:transparent;color:var(--muted);border:0;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:20px;display:flex;flex-direction:column;gap:14px}
section>p{margin:0;max-width:68ch}
.verdict{border-left:4px solid var(--warn);padding:8px 12px;background:var(--chip);border-radius:0 8px 8px 0;font-weight:500}
.verdict.ok{border-color:var(--ok)}.verdict.bad{border-color:var(--bad)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.controls label{font-size:14px;color:var(--muted)}
select,input[type=number]{font:inherit;font-size:15px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.chart{position:relative;height:300px;width:100%}
.chart.tall{height:420px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.note{font-size:14px;color:var(--muted);margin:0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--chip);color:var(--muted)}
.pill.in{color:var(--ok)}.pill.out{color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card h3{font-size:15px;margin:0;font-weight:600}
.card p{margin:0;font-size:14px;color:var(--muted)}
.tag{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.strength{display:flex;gap:3px}.strength b{width:18px;height:6px;border-radius:3px;background:var(--line)}.strength b.on{background:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:4px 12px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--chip);border-radius:10px;padding:10px 12px;min-width:0}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi strong{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
ul.src{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
ul.src li{margin-block:3px}
a{color:var(--focus)}
footer{margin-top:24px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

S.pl.srcs=S.en.srcs.map(function(x,i){return i===S.en.srcs.length-1?['Analizowany artykuł (cryps.pl)',x[1]]:x});

/* ---------- helpers ---------- */
var LANG='en', charts={};
function $(id){return document.getElementById(id)}
function t(k){return S[LANG][k]}
function f(x,d){return x.toLocaleString(LANG==='pl'?'pl-PL':'en-US',{minimumFractionDigits:d==null?1:d,maximumFractionDigits:d==null?1:d})}
function ln(k){return LN[LANG][k]||k}
function cv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function colFor(k){return k==='pl'?cv('--pl'):k==='en'?cv('--en'):cv('--sl')}
function kill(id){if(charts[id]){charts[id].destroy();delete charts[id]}}
function baseOpts(){
  var ink=cv('--ink'),mut=cv('--muted'),line=cv('--line');
  Chart.defaults.font.family=cv('--sans');Chart.defaults.color=mut;
  return {ink:ink,mut:mut,line:line};
}
function fill(){
  document.querySelectorAll('[data-i]').forEach(function(n){n.textContent=t(n.getAttribute('data-i'))});
  document.documentElement.lang=LANG;
  $('bPL').setAttribute('aria-pressed',LANG==='pl');$('bEN').setAttribute('aria-pressed',LANG==='en');
  var o=$('orSel').options;o[0].text=t('s1_pool');o[1].text=t('s1_o3');
  var n=$('nSel').options;n[0].text=t('n25');n[1].text=t('n125');
  var a=$('agSel').options;a[0].text=t('s4_gaia');a[1].text=t('s4_mif');
  var m=$('mmSel');if(!m.options.length){D.mm.cols.forEach(function(c,i){var op=document.createElement('option');op.value=i;op.text=c;m.add(op)});m.value=1}
  var tl=$('tkLang');var cur=tl.value||'pl';tl.innerHTML='';
  D.tok.filter(function(x){return x[0]!=='en'}).forEach(function(x){var op=document.createElement('option');op.value=x[0];op.text=ln(x[0]);tl.add(op)});tl.value=cur;
  var ul=$('gaps');ul.innerHTML='';t('gaps').forEach(function(g){var li=document.createElement('li');li.textContent=g;ul.appendChild(li)});
  var su=$('srcs');su.innerHTML='';t('srcs').forEach(function(s){var li=document.createElement('li');var a2=document.createElement('a');a2.href=s[1];a2.target='_blank';a2.rel='noopener noreferrer';a2.textContent=s[0];li.appendChild(a2);su.appendChild(li)});
  renderChips();renderCards();
}

/* ---------- claims ---------- */
var FILTER='all';
function renderChips(){
  var box=$('chips');box.innerHTML='';
  [['all','f_all'],['ret','f_ret'],['rea','f_rea'],['age','f_age'],['cost','f_cost']].forEach(function(p){
    var b=document.createElement('button');b.type='button';b.textContent=t(p[1]);b.setAttribute('aria-pressed',FILTER===p[0]);
    b.onclick=function(){FILTER=p[0];renderChips();renderCards()};box.appendChild(b)});
}
function renderCards(){
  var box=$('cards');box.innerHTML='';
  t('claims').filter(function(c){return FILTER==='all'||c[0]===FILTER}).forEach(function(c){
    var d=document.createElement('div');d.className='card';
    var h=document.createElement('h3');h.textContent=c[1];
    var v=document.createElement('p');v.textContent=c[2];v.style.color=cv(c[3]==='ok'?'--ok':c[3]==='bad'?'--bad':'--warn');v.style.fontWeight='600';
    var s=document.createElement('div');s.className='strength';s.title=t('str');s.setAttribute('role','img');s.setAttribute('aria-label',t('str')+': '+c[4]+'/4');
    for(var i=0;i<4;i++){var b=document.createElement('b');if(i<c[4])b.className='on';s.appendChild(b)}
    d.appendChild(h);d.appendChild(v);d.appendChild(s);box.appendChild(d)});
}

/* ---------- OneRuler ---------- */
function renderOR(){
  var o=baseOpts(),mode=$('orSel').value,rows=D.oneruler[mode];
  kill('or');
  charts.or=new Chart($('cOneRuler'),{type:'bar',
    data:{labels:rows.map(function(r){return ln(r[0])}),datasets:[{data:rows.map(function(r){return r[1]}),backgroundColor:rows.map(function(r){return colFor(r[0])}),borderRadius:4}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return f(c.parsed.y)+'%'}}}},
      scales:{y:{min:mode==='pool'?50:50,max:100,grid:{color:o.line},ticks:{callback:function(v){return v+'%'}}},x:{grid:{display:false}}}}});
  $('orNote').textContent=t(mode==='pool'?'or_pool':'or_o3');
}
function renderBooks(){
  var tb=$('bookTbl');tb.innerHTML='<tr><th>'+t('book_l')+'</th><th>'+t('book_b')+'</th></tr>';
  Object.keys(D.oneruler.books).forEach(function(k){var r=tb.insertRow();var c1=r.insertCell();c1.textContent=ln(k);var c2=r.insertCell();c2.textContent=D.oneruler.books[k]});
}

/* ---------- mmPISA ---------- */
function renderMM(){
  var o=baseOpts(),ci=+$('mmSel').value,n=+$('nSel').value;
  var keys=Object.keys(D.mm.rows).sort(function(a,b){return D.mm.rows[b][ci]-D.mm.rows[a][ci]});
  kill('mm');
  charts.mm=new Chart($('cMM'),{type:'bar',
    data:{labels:keys.map(ln),datasets:[{data:keys.map(function(k){return D.mm.rows[k][ci]}),backgroundColor:keys.map(colFor),borderRadius:4}]},
    options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return f(c.parsed.x)+'%'}}}},
      scales:{x:{min:70,max:100,grid:{color:o.line},ticks:{callback:function(v){return v+'%'}}},y:{grid:{display:false}}}}});
  var en=D.mm.rows.en[ci]/100,tb=$('mmTbl');
  tb.innerHTML='<tr><th>'+t('th_lang')+'</th><th class="n">'+t('th_acc')+'</th><th class="n">'+t('th_d')+'</th><th class="n">'+t('th_noise')+'</th><th>'+t('th_s')+'</th></tr>';
  keys.filter(function(k){return k!=='en'}).forEach(function(k){
    var p=D.mm.rows[k][ci]/100,d=(p-en)*100;
    var se=Math.sqrt(p*(1-p)/n+en*(1-en)/n)*1.96*100;
    var out=se>0&&Math.abs(d)>se;
    var r=tb.insertRow();
    r.insertCell().textContent=ln(k);
    var a=r.insertCell();a.className='n';a.textContent=f(p*100);
    var b=r.insertCell();b.className='n';b.textContent=(d>0?'+':'')+f(d);
    var c=r.insertCell();c.className='n';c.textContent='±'+f(se);
    var e=r.insertCell();var s=document.createElement('span');s.className='pill '+(out?'out':'in');s.textContent=t(out?'out_noise':'in_noise');e.appendChild(s);
    if(k==='pl'){r.style.fontWeight='600'}
  });
}

/* ---------- agents ---------- */
function renderAg(){
  var o=baseOpts(),mode=$('agSel').value,rows=D[mode];kill('ag');
  charts.ag=new Chart($('cAg'),{type:'bar',
    data:{labels:rows.map(function(r){return r[0]}),datasets:[
      {label:t('lg_en'),data:rows.map(function(r){return r[1]}),backgroundColor:cv('--en'),borderRadius:4},
      {label:mode==='gaia'?(LANG==='pl'?'Języki docelowe (średnia)':'Target languages (avg)'):t('lg_pl'),data:rows.map(function(r){return r[2]}),backgroundColor:mode==='gaia'?cv('--sl'):cv('--pl'),borderRadius:4}]},
    options:{maintainAspectRatio:false,plugins:{legend:{labels:{color:o.mut}},tooltip:{callbacks:{afterBody:function(items){var r=rows[items[0].dataIndex];return (LANG==='pl'?'Luka: ':'Gap: ')+f(r[1]-r[2])+' pkt'},label:function(c){return c.dataset.label+': '+f(c.parsed.y)}}}},
      scales:{y:{min:0,max:100,grid:{color:o.line}},x:{grid:{display:false},ticks:{maxRotation:40,autoSkip:false}}}}});
  $('agNote').textContent=t(mode==='gaia'?'ag_gaia':'ag_mif');

/* ---------- tokens ---------- */
function renderTok(){
  var o=baseOpts();kill('tok');
  charts.tok=new Chart($('cTok'),{type:'bar',
    data:{labels:D.tok.map(function(r){return ln(r[0])}),datasets:[{data:D.tok.map(function(r){return r[1]}),backgroundColor:D.tok.map(function(r){return colFor(r[0])}),borderRadius:4}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return f(c.parsed.y,2)+(LANG==='pl'?' tokena/słowo':' tokens/word')}}}},
      scales:{y:{min:0,grid:{color:o.line}},x:{grid:{display:false}}}}});
  calc();
}
function calc(){
  var lang=$('tkLang').value,w=Math.max(0,+$('tkWords').value||0),pr=Math.max(0,+$('tkPrice').value||0),ctx=Math.max(1,+$('tkCtx').value||1);
  var e=1.23,x=D.tok.filter(function(r){return r[0]===lang})[0][1];
  var items=[[t('k_tok_en'),f(w*e,0)],[ln(lang)+' '+t('k_tok_x'),f(w*x,0)],[t('k_ratio'),f(x/e,2)+'×'],
    [t('k_cost_en'),f(w*e/1e6*pr,2)],[ln(lang)+' '+t('k_cost_x'),f(w*x/1e6*pr,2)],
    [t('k_fit_en'),f(ctx/e,0)],[ln(lang)+' '+t('k_fit_x'),f(ctx/x,0)]];
  var box=$('tkOut');box.innerHTML='';
  items.forEach(function(it){var d=document.createElement('div');d.className='kpi';var s=document.createElement('span');s.textContent=it[0];var st=document.createElement('strong');st.textContent=it[1];d.appendChild(s);d.appendChild(st);box.appendChild(d)});
}

function all(){renderOR();renderBooks();renderMM();renderRet();renderAg();renderTok();renderCards()}
function setLang(l){LANG=l;fill();all()}

$('bPL').onclick=function(){setLang('pl')};$('bEN').onclick=function(){setLang('en')};
['orSel'].forEach(function(i){$(i).onchange=renderOR});
$('mmSel').onchange=renderMM;$('nSel').onchange=renderMM;$('agSel').onchange=renderAg;
['tkLang','tkWords','tkPrice','tkCtx'].forEach(function(i){$(i).oninput=calc;$(i).onchange=calc});
$('nSel').value='25';
fill();
if(window.Chart){all()}else{window.addEventListener('load',all)}
try{new MutationObserver(function(){all()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){all()})}catch(e){}
})();
